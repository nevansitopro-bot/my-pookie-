//  MOTOR

const NUM_PARTICULAS = 24000;
const SX = 1, SZ = 1, ROT0 = 0, TORSION = 0;   // forma ovalada y torcida
function elip(R, a) {
  const x0 = R * Math.cos(a) * SX, z0 = R * Math.sin(a) * SZ;
  const p = ROT0 + TORSION * (R - 45), c = Math.cos(p), s = Math.sin(p);
  return [x0 * c - z0 * s, x0 * s + z0 * c];
}
const RADIO_AGUJERO = 38;
const ALTURA_CORAZON = 255;
const TAM_CORAZON = 112;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 700;

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

const NC = 24;
const PARADAS = [[0, 185, 140, 235], [0.35, 215, 150, 230], [0.7, 245, 185, 215], [1, 255, 232, 240]];
function colorT(t) {
  for (let i = 0; i < PARADAS.length - 1; i++) {
    const a = PARADAS[i], b = PARADAS[i + 1];
    if (t <= b[0]) { const u = (t - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u]; }
  }
  return [255, 225, 240];
}
const colores = [];
for (let i = 0; i < NC; i++) colores.push(colorT(i / (NC - 1)).map(Math.round));

}

let t0 = performance.now() / 1000, tiempo = 0;

function frame() {
  const ahora = performance.now() / 1000;
  const dt = Math.min(ahora - t0, 0.05);
  t0 = ahora; tiempo += dt;

  if (!arrastrando) yaw += dt * (entrado ? 0.06 : 0.12);
  const inactivo = ahora - ultimoInteraccion > 3;
  if (!entrado) { tDist = 4200; }
  else if (inactivo) {
    tPitch = 0.3 + Math.sin(tiempo * 0.11) * 0.1;
    tDist = 1750 + Math.sin(tiempo * 0.08) * 400;
    pitch += (tPitch - pitch) * Math.min(1, dt * 0.8);
  }
  if (entrado && dist > 2600 && inactivo) tDist = 1750;
  dist += (tDist - dist) * Math.min(1, dt * (entrado ? velZoom : 2.5));

  const cx = W / 2, cy = H * 0.6;
  const cY = Math.cos(yaw), sY = Math.sin(yaw);
  const cP = Math.cos(pitch), sP = Math.sin(pitch);

  function proy(x, y, z) {
    const x1 = x * cY + z * sY;
    const z1 = -x * sY + z * cY;
    const y2 = y * cP + z1 * sP;
    const cz = dist + z1 * cP - y * sP;
    const k = F / cz;
    return [cx + x1 * k, cy - y2 * k, cz, k];
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  for (const s of estrellas) {
    const a = s.a * (0.7 + 0.3 * Math.sin(tiempo * 1.2 + s.f));
    ctx.fillStyle = s.p ? 'rgba(230,200,255,' + a.toFixed(3) + ')' : 'rgba(215,200,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x * W, s.y * H, 1.2, 1.2);
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const n of neb) {
    const p = proy(n[0], n[1], n[2]); if (p[2] < 300) continue;
    const sz2 = n[3] * p[3];
    if (p[0] < -sz2 || p[0] > W + sz2 || p[1] < -sz2 || p[1] > H + sz2) continue;
    ctx.globalAlpha = 0.16; ctx.drawImage(sprites[n[4]], p[0] - sz2 / 2, p[1] - sz2 / 2, sz2, sz2);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const st of mundo) {
    const p = proy(st[0], st[1], st[2]);
    if (p[2] < 300 || p[0] < 0 || p[1] < 0 || p[0] > W || p[1] > H) continue;
    ctx.globalAlpha = st[3] * (0.7 + 0.3 * Math.sin(tiempo * 1.3 + st[4]));
    ctx.fillStyle = st[5]; ctx.fillRect(p[0], p[1], st[6], st[6]);
  }
  ctx.globalAlpha = 1;

  // proyectar galaxia
  for (let i = 0; i < N; i++) {
    pa[i] += pw[i] * dt;
    const x0 = pr[i] * Math.cos(pa[i]) * SX, z0 = pr[i] * Math.sin(pa[i]) * SZ;
    const x = x0 * pcs[i] - z0 * psn[i], z = x0 * psn[i] + z0 * pcs[i];
    const x1 = x * cY + z * sY;
    const z1 = -x * sY + z * cY;
    const y2 = py[i] * cP + z1 * sP;
    const cz = dist + z1 * cP - py[i] * sP;
    const k = F / cz;
    sx[i] = cx + x1 * k; sy[i] = cy - y2 * k; sz[i] = cz;
  }
  const centro = proy(0, 0, 0);
  const kc = centro[3];
  const latido = Math.pow(Math.max(0, Math.sin(tiempo * 3.3)), 6);

  function dibujarParticulas(detras) {
    ctx.globalCompositeOperation = 'lighter';
    let cActual = -1;
    for (let i = 0; i < N; i++) {
      if ((sz[i] >= dist) !== detras) continue;
      const x = sx[i], y = sy[i];
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      const prof = clamp(1.25 - (sz[i] - dist) / 1000, 0.4, 1.25);
      if (pg[i]) {
        const s = 14 * kc * (0.8 + 0.4 * pl[i]);
        ctx.globalAlpha = clamp(0.4 * prof, 0, 1);
        ctx.drawImage(sprites[pc[i]], x - s / 2, y - s / 2, s, s);
      } else {
        if (pc[i] !== cActual) { cActual = pc[i]; const c = colores[cActual]; ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
        ctx.globalAlpha = clamp(pl[i] * prof, 0, 1);
        const tam = ps[i] * 1.15 * (kc > 0.9 ? 1.4 : 1) * (kc > 1.5 ? 1.3 : 1);
        ctx.fillRect(x, y, tam, tam);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // anillo del agujero negro
  const RA = RADIO_AGUJERO * 1.05;
  const anillo = [];
  for (let i = 0; i <= 160; i++) {
    const a = (i % 160) / 160 * Math.PI * 2;
    anillo.push(proy(RA * Math.cos(a), 0, RA * Math.sin(a)));
  }
  function dibujarAnillo(detras) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = detras ? 'rgba(220,205,255,0.5)' : '#ffe3f1';
    ctx.shadowColor = '#b28cff';
    ctx.shadowBlur = detras ? 14 : 26;
    ctx.lineWidth = Math.max(2, 3.4 * kc);
    ctx.beginPath();
    let abierto = false;
    for (let i = 0; i <= 160; i++) {
      const p = anillo[i];
      if ((p[2] >= dist) === detras) { if (!abierto) { ctx.moveTo(p[0], p[1]); abierto = true; } else ctx.lineTo(p[0], p[1]); }
      else abierto = false;
    }
    ctx.stroke();
    ctx.restore();
  }

  // 1) resplandor del núcleo + parte de atrás
  ctx.globalCompositeOperation = 'lighter';
  const hs = 460 * kc * (1 + latido * 0.05);
  ctx.globalAlpha = 0.75;
  ctx.drawImage(spriteHalo, centro[0] - hs / 2, centro[1] - hs / 2 * 0.62 - 0 , hs, hs * 0.62);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  dibujarParticulas(true);
  dibujarAnillo(true);

  // 2) agujero negro (cúpula)
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, centro[1] + RA * kc * Math.sin(pitch) + 0.5);
  ctx.clip();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(centro[0], centro[1], RADIO_AGUJERO * kc, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3) parte de adelante
  dibujarParticulas(false);
  dibujarAnillo(false);

  // 4) anillos de texto sobre el disco
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + TAM_LETRA + 'px Georgia, serif';
  for (const an of anillos) {
    an.rot += an.vel * dt;
    for (const ch of an.letras) {
      const a = ch.a + an.rot;
      const e = 10;
      const P = elip(an.R, a), T = elip(an.R, a + 0.02), I = elip(an.R - 6, a);
      const X = P[0], Z = P[1];
      let tx = T[0] - X, tz = T[1] - Z; const tl = Math.hypot(tx, tz) || 1; tx = tx / tl * e; tz = tz / tl * e;
      let ux = I[0] - X, uz = I[1] - Z; const ul = Math.hypot(ux, uz) || 1; ux = ux / ul * e; uz = uz / ul * e;
      const p0 = proy(X, an.y, Z);
      if (p0[2] < 150 || p0[0] < -60 || p0[0] > W + 60 || p0[1] < -60 || p0[1] > H + 60) continue;
      const p1 = proy(X + tx, an.y, Z + tz);
      const p2 = proy(X + ux, an.y, Z + uz);
      const ax = (p1[0] - p0[0]) / e, ay = (p1[1] - p0[1]) / e;
      const bx = -(p2[0] - p0[0]) / e, by = -(p2[1] - p0[1]) / e;
      ctx.setTransform(ax * DPR, ay * DPR, bx * DPR, by * DPR, p0[0] * DPR, p0[1] * DPR);
      const lejos = clamp((p0[2] - (dist - 400)) / 1100, 0, 1);
      ctx.globalAlpha = 0.95 - lejos * 0.55;
      ctx.shadowColor = '#b28cff'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#f1e4ff';
      ctx.fillText(ch.c, 0, 0);
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // 5) corazón de partículas sobre el agujero negro
  {
    const sway = Math.sin(tiempo * 0.5) * 0.45;
    const rr = -yaw + sway;               // siempre mira hacia la cámara
    const cr = Math.cos(rr), sr = Math.sin(rr);
    const esc = 1 + 0.07 * latido + 0.015 * Math.sin(tiempo * 1.7);
    const flota = ALTURA_CORAZON + Math.sin(tiempo * 0.9) * 10;
    const cH = proy(0, flota, 0);
    // halo detrás del corazón
    ctx.globalCompositeOperation = 'lighter';
    const hh = TAM_CORAZON * 3.2 * cH[3] * esc;
    ctx.globalAlpha = 0.35 + 0.25 * latido;
    ctx.drawImage(spriteHalo, cH[0] - hh / 2, cH[1] - hh / 2, hh, hh);
    for (let i = 0; i < hx.length; i++) {
      const lx = hx[i] * esc, ly = hy[i] * esc, lz = hz[i];
      const wx = lx * cr + lz * sr, wz = -lx * sr + lz * cr;
      const x1 = wx * cY + wz * sY;
      const z1 = -wx * sY + wz * cY;
      const wy = ly + flota;
      const y2 = wy * cP + z1 * sP;
      const cz = dist + z1 * cP - wy * sP;
      const k = F / cz;
      const X = cx + x1 * k, Y = cy - y2 * k;
      if (hb[i]) {
        const s = clamp(11 * k, 4, 18) * (0.85 + 0.3 * Math.sin(tiempo * 4 + i));
        ctx.globalAlpha = 0.8;
        ctx.drawImage(sprites[hc[i]], X - s / 2, Y - s / 2, s, s);
      } else {
        const c = colores[hc[i]];
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(tiempo * 2 + i * 0.37);
        ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        const tam = clamp(2.1 * k, 1, 3.2);
        ctx.fillRect(X, Y, tam, tam);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // 6) corazoncitos flotando
  {
    const lista = [];
    for (const h of flot) {
      h.a += h.w * dt;
      const yy = h.y + Math.sin(tiempo * 0.8 + h.fase) * 14;
      lista.push([proy(h.r * Math.cos(h.a), yy, h.r * Math.sin(h.a)), h]);
    }
    lista.sort((u, v) => v[0][2] - u[0][2]);
    for (const [p, h] of lista) {
      if (p[2] < 150) continue;
      const s = h.tam * p[3] * (1 + 0.12 * Math.sin(tiempo * 3 + h.fase));
      ctx.shadowColor = '#b28cff'; ctx.shadowBlur = 14;
      ctx.globalAlpha = clamp(1.1 - (p[2] - dist) / 1500, 0.3, 1);
      ctx.fillStyle = h.ton < 0.5 ? '#f3a6c8' : '#c9a8ff';
      dibujarCorazon(p[0], p[1], s);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff';
      ctx.fillRect(p[0] - s * 0.5, p[1] - s * 0.45, Math.max(1, s * 0.22), Math.max(1, s * 0.22));
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  // 7) mensajes dispersos (aparecen y se desvanecen)
  {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lista = [];
    for (const m of textos) {
      m.a += m.w * dt;
      const bob = Math.sin(tiempo * 0.5 * m.vel + m.fase) * m.bob;
      const p = proy(m.r * Math.cos(m.a), m.y + bob, m.r * Math.sin(m.a));
      if (p[2] < 150) continue;

    const ocupados = [];
    let visibles = 0;
    for (const [p, m] of lista) {
      if (visibles >= 9) break;
      const fase = ((tiempo + m.off) % m.ciclo) / m.ciclo;
      const ventana = 0.24;
      if (fase > ventana) continue;
      const env = Math.sin((fase / ventana) * Math.PI);
      const tam = clamp(14 * p[3], 9, 17);
      const lejos = clamp((p[2] - (dist - 500)) / 1500, 0, 1);
      const alfa = env * (0.85 - lejos * 0.45);
      if (alfa < 0.05) continue;
      ctx.font = 'italic ' + tam.toFixed(1) + 'px Georgia, serif';
      const ancho = ctx.measureText(m.txt).width;
      const x0 = p[0] - ancho / 2 - 14, x1 = p[0] + ancho / 2 + 14, y0 = p[1] - tam - 6, y1 = p[1] + tam + 6;
      if (x1 < 0 || x0 > W || y1 < 0 || y0 > H) continue;
      let choca = false;
      for (const o of ocupados) { if (x0 < o[2] && x1 > o[0] && y0 < o[3] && y1 > o[1]) { choca = true; break; } }
      if (choca) continue;
      ocupados.push([x0, y0, x1, y1]);
      visibles++;
      ctx.shadowColor = 'rgba(170,130,255,' + alfa.toFixed(3) + ')';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(255,232,243,' + alfa.toFixed(3) + ')';
      ctx.fillText(m.txt, p[0], p[1]);
    }
    ctx.shadowBlur = 0;
  }

  // 8) estrellas fugaces y corazoncitos al tocar
  ctx.shadowBlur = 0;
  if (entrado && Math.random() < dt * 0.3) {
    const d = Math.random() < 0.5 ? 1 : -1;
    fugaces.push({ x: d > 0 ? Math.random() * W * 0.6 : W - Math.random() * W * 0.6, y: Math.random() * H * 0.45, vx: d * (380 + Math.random() * 260), vy: 160 + Math.random() * 120, v: 0 });
  }
  for (let i = fugaces.length - 1; i >= 0; i--) {
    const f = fugaces[i]; f.v += dt; f.x += f.vx * dt; f.y += f.vy * dt;
    const a = clamp(1 - f.v / 1.4, 0, 1);
    if (a <= 0) { fugaces.splice(i, 1); continue; }
    for (let k = 0; k < 14; k++) {
      ctx.globalAlpha = a * (1 - k / 14) * 0.85;
      ctx.fillStyle = k < 2 ? '#fff' : '#e4d6ff';
      const z = 2.6 - k * 0.14;
      ctx.fillRect(f.x - f.vx * 0.012 * k, f.y - f.vy * 0.012 * k, z, z);
    }
  }
  for (let i = corazonesTap.length - 1; i >= 0; i--) {
    const h = corazonesTap[i]; h.v += dt; h.x += h.vx * dt; h.y += h.vy * dt; h.vy -= 10 * dt;
    const a = clamp(1 - h.v / 2.6, 0, 1);
    if (a <= 0) { corazonesTap.splice(i, 1); continue; }
    ctx.globalAlpha = a; ctx.fillStyle = i % 2 ? '#f3b6d6' : '#d4bfff';
    dibujarCorazon(h.x, h.y, h.t * (0.8 + h.v * 0.1));
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
